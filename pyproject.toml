[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvary-scada"
version = "0.2.0"
description = "NEXVARY SCADA - Industrial Monitoring & Control Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
industrial = [
  "pyserial>=3.5,<4",
  "paho-mqtt>=2,<3",
  "asyncua>=1.1,<2",
]
packaging = ["pyinstaller>=6,<7"]

[project.scripts]
nexvary-scada = "nexvary_scada.api:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexvary_scada = ["ui/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
