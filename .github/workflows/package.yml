name: Package
on:
  push:
    branches: [main, "dev/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: NEXVARY-SCADA-Windows-x64
          - os: ubuntu-latest
            artifact: NEXVARY-SCADA-Ubuntu-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[packaging]"
      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/NEXVARY_SCADA.spec
      - name: Smoke executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\dist\NEXVARY-SCADA.exe --check
      - name: Smoke executable (Linux)
        if: runner.os == 'Linux'
        run: ./dist/NEXVARY-SCADA --check
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/NEXVARY-SCADA.exe
          if-no-files-found: error
      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/NEXVARY-SCADA
          if-no-files-found: error
