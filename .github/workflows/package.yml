name: Package
on:
  push:
    branches: [main, "dev/platform-stage-150"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: NEXVARY-SCADA-Windows-x64
          - os: ubuntu-latest
            artifact: NEXVARY-SCADA-Ubuntu-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[packaging]"
      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/NEXVARY_SCADA.spec
      - name: Smoke executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\dist\NEXVARY-SCADA.exe --check
      - name: Smoke executable (Linux)
        if: runner.os == 'Linux'
        run: ./dist/NEXVARY-SCADA --check
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path .\dist\NEXVARY-SCADA.exe -DestinationPath .\dist\NEXVARY-SCADA-Windows-x64.zip -Force
      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/NEXVARY-SCADA-Ubuntu-x64.tar.gz NEXVARY-SCADA
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
